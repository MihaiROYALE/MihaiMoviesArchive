<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mihai's Movie &amp; Series Archive</title>
<meta name="description" content="Every movie and series Mihai has watched, rated out of 5. Browse by year, rating or search.">
<meta property="og:title" content="Mihai's Movie & Series Archive">
<meta property="og:description" content="Every movie and series watched, rated and archived.">
<meta name="theme-color" content="#0b0b0e">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="index.css">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||(!t&&matchMedia('(prefers-color-scheme:light)').matches))document.documentElement.classList.add('light')}catch(e){}</script>
</head>
<body>
<nav class="nav" aria-label="Main">
  <button data-tab="m" aria-label="Movies"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg><span>Movies</span></button>
  <button data-tab="s" aria-label="Series"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 21h8M12 18v3"/></svg><span>Series</span></button>
  <button id="openSearch" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>Search</span></button>
  <button id="theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg><span>Theme</span></button>
</nav>
<main>
  <header class="hero">
    <div class="brand"><button class="blogo toTop" aria-label="Back to top"><img src="CTC-logo.png" alt="" onerror="this.parentNode.remove()"></button><div><p class="eyebrow">The archive</p><h1 id="title">Mihai's Movie Archive</h1></div></div>
    <p class="tag">Everything I've watched, rated out of 5. Tap any poster for details.</p>
    <div class="stats" id="stats" aria-live="polite"></div>
  </header>
  <div class="toolbar"><button class="tlogo toTop" aria-label="Back to top"><img src="CTC-logo.png" alt="" onerror="this.parentNode.remove()"></button>
    <div class="seg" role="tablist"><button data-tab="a" role="tab">All <b id="ca"></b></button><button data-tab="m" role="tab">Movies <b id="cm"></b></button><button data-tab="s" role="tab">Series <b id="cs"></b></button></div>
    <div class="views"><button data-view="years" aria-label="Rows by year"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><button data-view="grid" aria-label="Grid"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg></button></div>
  </div>
  <div class="filters">
    <select id="sort" aria-label="Sort"><option value="yd">Year: newest</option><option value="ya">Year: oldest</option></select>
    <div class="chips" id="ratings"></div>
    <button class="chip" id="genreBtn">Category ▾</button><button class="chip" id="random">🎲 Random pick</button>
  </div>
  <div class="chips years" id="yearNav"></div>
  <p class="count" id="count" aria-live="polite"></p>
  <div id="list"></div>
  <footer class="foot" id="foot"></footer>
</main>

<dialog id="search" aria-label="Search">
  <div class="shead"><div class="sbar"><input id="q" type="search" placeholder="Search a title or year…" autocomplete="off"><button class="x" data-close aria-label="Close">✕</button></div>
  <div class="chips" id="scope"><button class="chip on" data-s="a">All</button><button class="chip" data-s="m">Movies</button><button class="chip" data-s="s">Series</button></div>
  <div class="sfilters"><select id="sSort" aria-label="Sort results"><option value="rel">Best match</option><option value="yd">Year: newest first</option><option value="ya">Year: oldest first</option></select><select id="sCat" aria-label="Category"><option value="">All categories</option></select><select id="sYear" aria-label="Decade"><option value="">All years</option></select><button class="chip" id="sClear">Clear</button></div></div>
  <p class="count" id="sc"></p><div class="grid" id="results"></div>
</dialog>
<dialog id="genres" aria-label="Category"><button class="x" data-close aria-label="Close">✕</button><div class="gd"><h2>Category</h2><div class="seg" id="gmode"><button data-gm="any" class="on">Match any</button><button data-gm="all">Match all</button></div><div class="chips wrap" id="glist"></div><div class="acts"><button class="btn" id="gclear">Clear</button><button class="btn p" data-close>Show results</button></div></div></dialog>
<dialog id="detail" aria-label="Details"><button class="x" data-close aria-label="Close">✕</button><div id="dbody"></div></dialog>
<noscript><p style="padding:2rem">This archive needs JavaScript enabled.</p></noscript>
<script src="data.js"></script>
<script src="index.js"></script>
</body>
</html>
